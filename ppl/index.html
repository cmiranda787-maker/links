<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Links for @ppl.weknowppl, the AI inside we know ppl." />
    <link rel="icon" href="data:," />
    <title>PPL Link Tree</title>
    <style>
      :root {
        --bg: #0b2a6a;
        --bg-deep: #061f55;
        --accent: #2d74d6;
        --accent-bright: #4a8de0;
        --white: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.72);
        --text-faint: rgba(255, 255, 255, 0.5);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--white);
        font-family: "Avenir Next", "Proxima Nova", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .page {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 30rem;
        margin: 0 auto;
        padding: 3.5rem 1.5rem 2rem;
      }

      /* Profile header */
      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: rise 0.55s ease both;
      }
      .avatar {
        width: 6.5rem;
        height: 6.5rem;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .lockup {
        width: 10.5rem;
        max-width: 62vw;
        height: auto;
        display: block;
        margin-top: 1.75rem;
      }
      .handle {
        margin: 0.9rem 0 0;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--white);
      }

      /* Links */
      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 2.75rem;
        animation: rise 0.55s ease 0.1s both;
      }
      .btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3.75rem;
        padding: 1rem 3rem;
        border-radius: 0.875rem;
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-decoration: none;
        text-align: center;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, filter 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn svg {
        position: absolute;
        right: 1.125rem;
        top: 50%;
        transform: translateY(-50%);
        width: 1.125rem;
        height: 1.125rem;
        flex: none;
      }
      .btn-hero {
        background: var(--white);
        color: var(--bg-deep);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32);
      }
      .btn-hero svg { color: var(--accent); }
      .btn-hero:hover { filter: brightness(0.96); transform: translateY(-1px); box-shadow: 0 18px 38px rgba(0, 0, 0, 0.36); }
      .btn-primary {
        background: var(--accent);
        color: var(--white);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
      }
      .btn-primary svg { color: rgba(255, 255, 255, 0.85); }
      .btn-primary:hover { background: var(--accent-bright); transform: translateY(-1px); box-shadow: 0 18px 38px rgba(0, 0, 0, 0.32); }
      .btn:active { transform: translateY(0) scale(0.99); }
      .btn:focus-visible {
        outline: 3px solid var(--white);
        outline-offset: 3px;
      }

      /* Footer */
      footer {
        margin-top: auto;
        padding-top: 3.5rem;
        animation: rise 0.55s ease 0.2s both;
      }
      footer p {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--text-faint);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .profile, .links, footer { animation: none; }
        .btn { transition: none; }
        .btn:hover { transform: none; }
      }
      @media (min-width: 40rem) {
        .page { padding-top: 4.5rem; }
        .avatar { width: 7.25rem; height: 7.25rem; }
        .lockup { width: 11.5rem; }
      }
    </style>
  </head>
