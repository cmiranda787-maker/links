    <style>
      :root {
        --midnight: #061f55;
        --highlight: #2d74d6;
        --highlight-bright: #4a8de0;
        --white: #ffffff;
        --white-soft: rgba(255, 255, 255, 0.72);
        --white-faint: rgba(255, 255, 255, 0.55);
        --outline: rgba(255, 255, 255, 0.85);
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--midnight);
        color: var(--white);
        font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .page {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(3rem, 11vh, 6.5rem) 1.25rem 1.5rem;
      }

      .column {
        width: 100%;
        max-width: 30rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      /* ---------- Profile header ---------- */

      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* The official logotype artwork ships as RGB with black baked in;
         mix-blend-mode: screen drops the black over Midnight Blue. */
      .wordmark {
        display: block;
        width: min(19rem, 78vw);
        height: auto;
        mix-blend-mode: screen;
      }

      .handle {
        margin: 1.4rem 0 0;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--white-soft);
      }

      /* ---------- Video ---------- */

      .video-wrap {
        width: 100%;
        margin-top: clamp(2.5rem, 7vh, 3.75rem);
      }

      .video-wrap video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 1rem;
        background: #000;
      }

      /* ---------- Links ---------- */

      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3.75rem;
        padding: 1rem 3rem;
        border-radius: 1rem;
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-decoration: none;
        text-align: center;
        transition: background-color 160ms ease, border-color 160ms ease,
          transform 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .btn svg {
        position: absolute;
        right: 1.25rem;
        top: 50%;
        transform: translateY(-50%);
        flex: none;
      }

      .btn:active { transform: scale(0.985); }

      .btn:focus-visible {
        outline: 3px solid var(--white);
        outline-offset: 3px;
      }

      .btn-hero {
        background: var(--highlight);
        color: var(--white);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      .btn-hero:hover { background: var(--highlight-bright); }

      .btn-outline {
        background: transparent;
        color: var(--white);
        border: 2px solid var(--outline);
      }

      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--white);
      }

      /* ---------- Footer ---------- */

      .footer {
        width: 100%;
        max-width: 30rem;
        margin-top: auto;
        padding-top: 3.5rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
      }

      .footer p {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--white-faint);
      }

      .emblem {
        display: block;
        width: 2.125rem;
        height: auto;
        opacity: 0.9;
        flex: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .btn { transition: none; }
        .btn:active { transform: none; }
      }
    </style>
  </head>
